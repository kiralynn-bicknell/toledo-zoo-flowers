/* Media query to target screens smaller than a tablet (mobile phones) */
@media (max-width: 767px) {
    /* 1. Force the pop-up container to sit firmly at the bottom of the screen */
    .leaflet-popup {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        transform: none !important;
        margin: 0 !important;
        padding: 0 !important;
        z-index: 2000 !important;
        width: 100% !important;
    }

    /* 2. Style the pop-up content to act like a slide-up app card */
    .leaflet-popup-content-wrapper {
        border-radius: 16px 16px 0 0 !important; /* Rounded top corners like a modern app */
        max-height: 45vh !important; /* Cap the height at 45% of the screen so it doesn't block the whole map */
        overflow-y: auto !important; /* Allow scrolling inside the card if there are multiple clustered plants */
        box-shadow: 0 -4px 15px rgba(0,0,0,0.25) !important;
        width: 100% !important;
        margin: 0 !important;
    }

    /* 3. Hide the little tail/pointer under the pop-up since it's anchored to the bottom */
    .leaflet-popup-tip-container {
        display: none !important;
    }

    /* 4. Reposition the close button so it's easy to tap on mobile */
    .leaflet-popup-close-button {
        padding: 12px !important;
        font-size: 18px !important;
        color: #666 !important;
    }
    
    /* 5. Ensure the photo scales nicely inside the restricted mobile view */
    .leaflet-popup-content img {
        max-height: 180px !important;
        object-fit: cover !important;
    }
}
